apiVersion: v1
kind: Namespace
metadata:
  name: friends-vpn
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: friends-vpn}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: friends-vpn-active}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: friends-vpn}
rules:
  - {apiGroups: [''], resources: [secrets], resourceNames: [friends-vpn-peers], verbs: [get]}
  - {apiGroups: [''], resources: [configmaps], resourceNames: [friends-vpn-active], verbs: [patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: friends-vpn}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: friends-vpn}
subjects: [{kind: ServiceAccount, name: friends-vpn, namespace: friends-vpn}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: friends-vpn}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: friends-vpn}}
  template:
    metadata: {labels: {app: friends-vpn}}
    spec:
      serviceAccountName: friends-vpn
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroupsPolicy: Strict
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sing-box
          image: docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command: [/opt/friends-vpn/friends-vpn]
          args: [gateway]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "2", memory: 512Mi}
          ports: [{name: wireguard, containerPort: 51820, protocol: UDP}]
          readinessProbe:
            exec: {command: [/opt/friends-vpn/friends-vpn, gateway-ready]}
            periodSeconds: 2
            timeoutSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/sing-box, readOnly: true}
            - {name: service-account, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: runtime, mountPath: /run/friends-vpn}
      volumes:
        - name: config
          secret: {secretName: friends-vpn, defaultMode: 0440}
        - {name: runtime, emptyDir: {sizeLimit: 1Mi}}
        - name: service-account
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
---
# The controller's opt-in host rule admits only this DNATed UDP service.
apiVersion: v1
kind: Service
metadata: {name: friends-vpn}
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector: {app: friends-vpn}
  ports: [{name: wireguard, port: 51820, targetPort: wireguard, nodePort: 31820, protocol: UDP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: wireguard-clients}
spec:
  podSelector: {matchLabels: {app: friends-vpn}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: UDP, port: 51820}]
