apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qbittorrent
resources: [security.yaml, stack.yaml, files.yaml, book-importer.yaml, ../../components/edge]
components: [../../integrations/books]
configMapGenerator:
  - name: qbittorrent-network
    files: [network.sh]
    options: {disableNameSuffixHash: true}
  - name: qbittorrent-bootstrap
    files: [bootstrap.py, install_webui.py, vuetorrent.json]
  - name: download-files
    files: [nginx.conf]
