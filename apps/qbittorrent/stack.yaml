apiVersion: v1
kind: Namespace
metadata:
  name: qbittorrent
  labels:
    # Gluetun needs CAP_NET_ADMIN in the pod network namespace for wg0 and its kill switch;
    # qBittorrent and every other container remain non-root with all capabilities dropped.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: config}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: downloads}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 200Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: qbittorrent}
spec:
  selector: {app: qbittorrent}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: qbittorrent-web}
spec:
  podSelector: {matchLabels: {app: qbittorrent}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: edge}}
        - podSelector: {matchLabels: {app: book-importer}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: edge-upstream}
spec:
  podSelector: {matchLabels: {app: edge}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: qbittorrent}}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: qbittorrent}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: qbittorrent}}
  template:
    metadata: {labels: {app: qbittorrent}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1800
      dnsPolicy: None
      dnsConfig:
        nameservers: [127.0.0.1]
        options: [{name: ndots, value: "1"}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroupsPolicy: Strict
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: configure
          image: ghcr.io/qbittorrent/docker-qbittorrent-nox:5.3.0-1@sha256:58ca75cb969c5185b7ad72fe877d9de1dc6891d0aef9d2ee20d0556b1d6ec3f9
          command: [python3, /bootstrap/bootstrap.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: downloads, mountPath: /downloads}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: wireguard, mountPath: /etc/vpn, readOnly: true}
        - name: vpn
          restartPolicy: Always
          image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          command: [/bin/sh, -ec, 'ip rule del table 51820 2>/dev/null || true; ip -6 rule del table 51820 2>/dev/null || true; exec /gluetun-entrypoint']
          env:
            - {name: VPN_SERVICE_PROVIDER, value: custom}
            - {name: VPN_TYPE, value: wireguard}
            - {name: VPN_INTERFACE, value: wg0}
            - {name: WIREGUARD_IMPLEMENTATION, value: kernelspace}
            - {name: WIREGUARD_CONF_SECRETFILE, value: /etc/vpn/wg0.conf}
            # Flannel over Tailscale gives pods 1230-byte interfaces; keep headroom for outer WireGuard headers.
            - {name: WIREGUARD_MTU, value: "1120"}
            - {name: WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL, value: 25s}
            - {name: FIREWALL_INPUT_PORTS, value: "8080"}
            - {name: FIREWALL_VPN_INPUT_PORTS, valueFrom: {secretKeyRef: {name: wireguard, key: vpn-input-ports}}}
            - {name: BLOCK_MALICIOUS, value: "off"}
            - {name: HEALTH_SMALL_CHECK_TYPE, value: dns}
            - {name: HTTP_CONTROL_SERVER_ADDRESS, value: "127.0.0.1:8000"}
            - {name: PUBLICIP_ENABLED, value: "off"}
            - {name: PUID, value: "0"}
            - {name: PGID, value: "0"}
            - {name: TZ, value: America/New_York}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_BIND_SERVICE]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            exec: {command: [/gluetun-entrypoint, healthcheck]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: [/gluetun-entrypoint, healthcheck]}
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - {name: wireguard, mountPath: /etc/vpn, readOnly: true}
        - name: webui
          image: ghcr.io/qbittorrent/docker-qbittorrent-nox:5.3.0-1@sha256:58ca75cb969c5185b7ad72fe877d9de1dc6891d0aef9d2ee20d0556b1d6ec3f9
          command: [python3, /bootstrap/install_webui.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: "1", memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
      containers:
        - name: qbittorrent
          image: ghcr.io/qbittorrent/docker-qbittorrent-nox:5.3.0-1@sha256:58ca75cb969c5185b7ad72fe877d9de1dc6891d0aef9d2ee20d0556b1d6ec3f9
          env:
            - {name: QBT_LEGAL_NOTICE, value: confirm}
            - {name: QBT_WEBUI_PORT, value: "8080"}
            - {name: UMASK, value: "0027"}
            - {name: TZ, value: America/New_York}
            - {name: HOME, value: /config}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /, port: 8080}}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: downloads, mountPath: /downloads}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: config}}
        - {name: downloads, persistentVolumeClaim: {claimName: downloads}}
        - {name: bootstrap, configMap: {name: qbittorrent-bootstrap}}
        - {name: credentials, secret: {secretName: credentials, defaultMode: 0440}}
        - {name: wireguard, secret: {secretName: wireguard, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
