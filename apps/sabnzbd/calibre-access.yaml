# Applied separately from the downloader's namespace-scoped kustomization.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sabnzbd-book-importer, namespace: calibre-web}
spec:
  podSelector: {matchLabels: {app: calibre-web}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: sabnzbd}}
          podSelector: {matchLabels: {app: book-importer}}
      ports: [{protocol: TCP, port: 8083}]
