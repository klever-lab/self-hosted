name: Friends VPN image

on:
  push:
    branches: [main, friends-vpn-portal]
    paths: ['apps/friends-vpn/live/**', '.github/workflows/friends-vpn-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FRIENDS_VPN_IMAGE: ghcr.io/klever-lab/self-hosted-friends-vpn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and build
        run: docker build --tag "$FRIENDS_VPN_IMAGE:$GITHUB_SHA" apps/friends-vpn/live
      - name: Publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$FRIENDS_VPN_IMAGE:$GITHUB_SHA"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$FRIENDS_VPN_IMAGE:$GITHUB_SHA" | tee "$GITHUB_STEP_SUMMARY"
